# ==========================================
# Server Configuration
# ==========================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=

# ==========================================
# Cấu hình kết nối MySQL Workbench
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/news_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# ==========================================
# File Upload Configuration
# ==========================================
app.file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:15MB}

# ==========================================
# JWT (JSON Web Token) Configuration
# ==========================================
# Base64 encoded secret key (min 256 bits)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 hours in milliseconds (86400000 ms)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# Global Application Constants & Meta
# ==========================================
app.name=News Backend API
app.version=1.0.0
app.description=RESTful API for News Management System
