# ==========================================
# Server Configuration
# ==========================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=

# ==========================================
# Database Configuration
# Defaults to local H2 persistent file database for instant zero-config startup.
# To switch to MySQL, set DB_URL, DB_USERNAME, DB_PASSWORD, DB_DRIVER in environment.
# Example for MySQL:
# DB_URL=jdbc:mysql://localhost:3306/news_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
# DB_USERNAME=root
# DB_PASSWORD=your_password
# DB_DRIVER=com.mysql.cj.jdbc.Driver
# ==========================================
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/newsdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# H2 Console (available at http://localhost:8080/h2-console when using H2)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# File Upload Configuration
# ==========================================
app.file.upload-dir=${FILE_UPLOAD_DIR:./uploads}
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:15MB}

# ==========================================
# JWT (JSON Web Token) Configuration
# ==========================================
# Base64 encoded secret key (min 256 bits)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
# 24 hours in milliseconds (86400000 ms)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ==========================================
# Global Application Constants & Meta
# ==========================================
app.name=News Backend API
app.version=1.0.0
app.description=RESTful API for News Management System
